name: unit-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libwebkit2gtk-4.1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend deps
        run: npm install

      - name: Build frontend
        run: npm run build

      # The Tauri build script requires the MCP sidecar staged under
      # src-tauri/binaries/ (gitignored build artifact) — build it before
      # any cargo command or tauri-build fails with "resource path ... doesn't exist".
      - name: Build MCP sidecar
        run: npm run build:mcp

      - name: Cargo test
        working-directory: src-tauri
        run: cargo test --all
